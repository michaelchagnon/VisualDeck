# Automated tests on every push and pull request.
#
# Linux: the full suite, OpenGL tests included, on Mesa's software renderer
# (llvmpipe) under Xvfb -- the same setup the suite is developed on.
# Windows: everything except the OpenGL readback tests, because GitHub's
# Windows runners have no GPU with OpenGL 3.3. OpenGL on Windows is covered by
# running `Start-VisualDeck.cmd test` on real machines.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SDL_AUDIODRIVER: dummy
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System packages (X server, Mesa OpenGL, Tk)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libxkbcommon0 tk
      - name: Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -p no:cacheprovider

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VD_SKIP_GL: "1"
      SDL_AUDIODRIVER: dummy
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Tests (OpenGL tests skipped)
        run: python -m pytest -p no:cacheprovider
